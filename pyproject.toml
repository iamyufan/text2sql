[project]
name = "text2sql"
version = "0.1.0"
description = "Text-to-SQL baseline: T5 fine-tuning on Spider dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.36",
    "datasets>=2.16",
    "peft>=0.10",
    "torch>=2.0",
    "wandb>=0.16",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "gdown>=5.2.1",
]
[project.optional-dependencies]
dev = ["pytest>=7.4", "gdown>=5.1"]
[dependency-groups]
dev = ["pytest>=7.4", "gdown>=5.1"]
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
